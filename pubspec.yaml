name: buat_usaha
description: "BuatUsaha: HPP, stok bahan, pesanan, dan untung-rugi harian untuk usaha rumahan."
publish_to: 'none'
# Nama versi dinaikkan saat rilis (PRD FR-11.1): angka terakhir untuk
# perbaikan, tengah untuk fitur baru. Nomor build (+1) ditimpa jumlah commit
# oleh tool/build_apk.ps1 dan CI; jangan pasang APK hasil `flutter build`
# biasa di atas versi rilis karena nomor build-nya lebih kecil.
version: 1.3.0+1

environment:
  sdk: ^3.13.1

dependencies:
  decimal: ^3.2.6
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  file_picker: ^13.1.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_local_notifications: ^22.3.2
  flutter_riverpod: ^3.4.3
  flutter_timezone: ^5.1.1
  go_router: ^18.1.0
  intl: ^0.20.3
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  timezone: ^0.11.2
  uuid: ^4.6.0
  workmanager: ^0.10.10
  firebase_core: ^5.0.0
  firebase_crashlytics: ^6.0.0
  firebase_auth: ^7.0.0
  cloud_firestore: ^7.0.0
  google_sign_in: ^7.2.0
  package_info_plus: ^10.2.2
  shared_preferences: ^2.5.6
  animations: ^3.0.0
  pdf: ^3.13.1
  printing: ^5.15.1
  image: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2

flutter:
  uses-material-design: true

  # Lisensi font (SIL OFL 1.1), didaftarkan ke LicenseRegistry di main.dart.
  assets:
    - assets/fonts/OFL-PlusJakartaSans.txt
    - assets/fonts/OFL-Fraunces.txt

  # Dibundel agar tampilan sama saat offline (Design.md bagian 4).
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-SemiBold.ttf
          weight: 600
